<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FichaFácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E8ECF0; --surface-3:#DCE2E8;
  --ink:#0E1A24; --ink-2:#4A5866; --ink-3:#7A8794; --line:#D3DAE1;
  --go:#0E8446; --go-hi:#0B6E3A; --go-soft:#DCF2E4; --go-ink:#FFFFFF;
  --stop:#CC2B2B; --stop-hi:#AD2020; --stop-soft:#FBE2DF; --stop-ink:#FFFFFF;
  --pause:#B86E00; --pause-soft:#FCEFD4;
  --accent:#2352C4; --accent-soft:#E2E9FA;
  --shadow:0 1px 2px rgba(14,26,36,.06),0 4px 16px rgba(14,26,36,.06);
  --r:14px; --r-sm:9px;
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1117; --surface:#121A21; --surface-2:#19232C; --surface-3:#22303B;
    --ink:#E7EDF2; --ink-2:#9DABB8; --ink-3:#6E7D8A; --line:#27333E;
    --go:#1FA85E; --go-hi:#27BD6B; --go-soft:#123324; --go-ink:#04140B;
    --stop:#E24848; --stop-hi:#F05A5A; --stop-soft:#3A1717; --stop-ink:#FFFFFF;
    --pause:#E9A23A; --pause-soft:#35270F;
    --accent:#7AA2FF; --accent-soft:#1A2743;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1117; --surface:#121A21; --surface-2:#19232C; --surface-3:#22303B;
  --ink:#E7EDF2; --ink-2:#9DABB8; --ink-3:#6E7D8A; --line:#27333E;
  --go:#1FA85E; --go-hi:#27BD6B; --go-soft:#123324; --go-ink:#04140B;
  --stop:#E24848; --stop-hi:#F05A5A; --stop-soft:#3A1717; --stop-ink:#FFFFFF;
  --pause:#E9A23A; --pause-soft:#35270F;
  --accent:#7AA2FF; --accent-soft:#1A2743;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:13px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.wordmark{font-weight:800;font-stretch:112%;letter-spacing:-.02em;font-size:18px;display:flex;align-items:center;gap:8px}
.wordmark .mark{width:22px;height:22px;border-radius:6px;background:var(--ink);position:relative;flex:none}
.wordmark .mark::after{content:"";position:absolute;left:6px;top:5px;width:10px;height:12px;border-left:3px solid var(--bg);border-top:3px solid var(--bg);border-radius:1px}
.wordmark .mark::before{content:"";position:absolute;left:9px;top:10px;width:6px;height:3px;background:var(--bg)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);font-weight:650;background:var(--surface-2);color:var(--ink);transition:background .15s,transform .08s}
.btn:hover{background:var(--surface-3)} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--bg)} .btn.primary:hover{opacity:.9}
.btn.go{background:var(--go);color:var(--go-ink)} .btn.go:hover{background:var(--go-hi)}
.btn.stop{background:var(--stop);color:var(--stop-ink)} .btn.stop:hover{background:var(--stop-hi)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)} .btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Form */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.in,select.in,textarea.in{width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px}
textarea.in{min-height:84px;resize:vertical}
.in:focus{border-color:var(--accent);outline:none}
.check{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.go{background:var(--go-soft);color:var(--go)} .pill.stop{background:var(--stop-soft);color:var(--stop)}
.pill.pause{background:var(--pause-soft);color:var(--pause)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink-2)}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px} .pad-l{padding:20px}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);animation:tin .2s ease-out;text-align:center}
.toast.err{background:var(--stop);color:var(--stop-ink)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Login ===== */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.pin-dots{display:flex;gap:14px;justify-content:center;padding:6px 0}
.pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3)}
.pin-dots span.on{background:var(--ink);border-color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:62px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:24px;font-weight:650;font-family:var(--f-mono)}
.keypad button:active{background:var(--surface-3)}
.keypad .k-alt{font-family:var(--f-ui);font-size:14px;color:var(--ink-2);box-shadow:none;background:transparent}
.demo-list{display:flex;flex-direction:column;gap:6px}
.demo-list button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.demo-list button:hover{background:var(--surface-3)}

/* ===== Worker (mobile) ===== */
.wk{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wk-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:10px}
.wk-main{flex:1;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:12px;font-weight:650;color:var(--ink-3);border-radius:10px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg{stroke-width:2.4}

.state{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--surface);box-shadow:var(--shadow)}
.state.on{background:var(--stop-soft)}
.state.paused{background:var(--pause-soft)}
.state .status{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.state .status .dot{width:10px;height:10px;border-radius:50%;background:var(--go)}
.state.on .status{color:var(--stop)} .state.on .status .dot{background:var(--stop);animation:pulse 1.6s infinite}
.state.paused .status{color:var(--pause)} .state.paused .status .dot{background:var(--pause)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--stop) 50%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.bigbtn{width:100%;min-height:clamp(150px,30vh,230px);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-stretch:118%;font-size:clamp(34px,10vw,46px);letter-spacing:.02em;transition:transform .08s,filter .15s;box-shadow:0 6px 18px color-mix(in srgb,currentColor 0%,transparent),inset 0 -5px 0 rgba(0,0,0,.14)}
.bigbtn small{font-size:14px;font-weight:600;font-stretch:100%;letter-spacing:0;opacity:.9}
.bigbtn:active{transform:scale(.985);filter:brightness(.95)}
.bigbtn.go{background:var(--go);color:var(--go-ink)}
.bigbtn.stop{background:var(--stop);color:var(--stop-ink);min-height:clamp(110px,20vh,160px)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:clamp(46px,15vw,68px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-align:center;padding:4px 0}
.state.on .timer{color:var(--stop)} .state.paused .timer{color:var(--pause)}
.where{text-align:center} .where h2{font-size:21px;font-weight:750}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:650;text-align:right}
.banner{border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--pause-soft)} .banner.crit{background:var(--stop-soft)}
.banner .i{margin-top:2px;color:var(--accent)} .banner.warn .i{color:var(--pause)} .banner.crit .i{color:var(--stop)}
.syncchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.syncchip.off{background:var(--pause-soft);color:var(--pause)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.avatar.sm{width:30px;height:30px;font-size:12px}

/* Sheets */
.sheet-back{position:fixed;inset:0;background:rgba(8,14,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-h{padding:16px 16px 10px;display:flex;align-items:center;gap:10px}
.sheet-b{padding:4px 16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:22px}}
.drawer-back{position:fixed;inset:0;background:rgba(8,14,20,.4);z-index:50;display:flex;justify-content:flex-end;animation:fade .15s}
.drawer{background:var(--bg);width:min(560px,100%);height:100%;display:flex;flex-direction:column;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.5}}
.drawer-h{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.drawer-b{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer-f{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.clist{display:flex;flex-direction:column;gap:8px}
.citem{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%}
.citem:active{background:var(--surface-2)}
.citem.sug{outline:2.5px solid var(--go);padding:16px 14px}
.ctype{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.citem.sug .ctype{background:var(--go-soft);color:var(--go)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .in{padding-left:40px}

.day{display:flex;flex-direction:column;gap:6px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px 0}
.day-h b{font-size:14px;text-transform:capitalize}
.erow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;background:var(--surface);border-radius:12px}
.erow .t{font-family:var(--f-mono);font-size:13.5px;color:var(--ink-2)}
.erow .d{font-family:var(--f-mono);font-weight:700;text-align:right}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot{background:var(--surface);border-radius:12px;padding:10px 12px}
.tot b{display:block;font-family:var(--f-mono);font-size:19px;letter-spacing:-.02em}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;padding:8px 10px;border-radius:9px;font-weight:650;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg)}

/* ===== Admin ===== */
.adm{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh}
.side .wordmark{padding:4px 8px 16px}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;font-weight:600;color:var(--ink-2);width:100%;text-align:left}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--ink);color:var(--bg)}
.nav .badge{margin-left:auto;background:var(--stop);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:800}
.adm-main{min-width:0;padding:20px 28px 60px;display:flex;flex-direction:column;gap:18px}
.adm-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.adm-top h1{font-size:26px;font-weight:780;font-stretch:108%}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--go)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--go);animation:pulse2 2s infinite}
@keyframes pulse2{50%{opacity:.35}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--f-mono);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.kpi .v small{font-size:15px;color:var(--ink-3);font-weight:500}
.kpi.alert .v{color:var(--stop)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.sec-h h2{font-size:16px;font-weight:750}
.live-list{display:flex;flex-direction:column}
.live-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.live-row .el{font-family:var(--f-mono);font-weight:700;font-size:16px;text-align:right}
.live-row .el.long{color:var(--stop)} .live-row .el.paused{color:var(--pause)}
.alerts{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:11px 16px 11px 0;border-top:1px solid var(--line);align-items:center}
.al .stripe{align-self:stretch;border-radius:0 3px 3px 0;background:var(--pause)}
.al.crit .stripe{background:var(--stop)}
.empty{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:750;border-bottom:0}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 16px}
.filters label.f{min-width:140px;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:0 16px 16px}
.cal .dh{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;text-align:center;padding:4px 0}
.cal .dc{min-height:78px;border-radius:10px;background:var(--surface-2);padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.cal .dc.out{opacity:.35}
.cal .dc.has{background:color-mix(in srgb,var(--go) calc(var(--lv,0) * 1%),var(--surface-2))}
.cal .dc b{font-family:var(--f-mono);font-size:14px}
.cal .dc .dn{font-size:12px;font-weight:700;color:var(--ink-2)}
.cal .dc.today{outline:2px solid var(--ink)}
.rtypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rtype{text-align:left;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.rtype.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rtype b{font-size:14.5px}
.mapbox{padding:0 12px 12px}
.mapbox svg{width:100%;height:auto;display:block;border-radius:12px;background:var(--surface-2)}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:12px;background:var(--surface)}

/* rebuild flat entries = month docs + pending offline queue */
function rebuildEntries() {
  const out = {};
  for (const [docId, doc] of Object.entries(S.data.monthDocs)) {
    for (const [id, e] of Object.entries(doc.items || {})) if (e && e.start) out[id] = { ...e, id, _doc: docId, _pending: false };
  }
  for (const op of S.queue) {
    const cur = out[op.id] || {};
    out[op.id] = { ...deepMerge(cur, op.patch), id: op.id, _doc: op.docId, _pending: true };
  }
  S.data.entries = out;
}

/* entry writes go through a persistent queue → works offline */
let flushing = false;
function queueEntry(entry, patch) {
  const docId = entry.workerId + '_' + mkey(entry.start);
  S.queue.push({ docId, workerId: entry.workerId, month: mkey(entry.start), id: entry.id, patch: clone(patch), t: Date.now() });
  ls.set('ff_queue', S.queue);
  rebuildEntries(); render();
  flushQueue();
}
async function flushQueue() {
  if (flushing || !S.queue.length) return;
  if (navigator.onLine === false) { S.online = false; paintSync(); return; }
  flushing = true;
  try {
    while (S.queue.length) {
      const op = S.queue[0];
      const path = 'entries/' + op.docId;
      try {
        await Store.update(path, { items: { [op.id]: op.patch } });
      } catch (e) {
        if (e && e.code === 'invalid_argument') {
          const existing = await Store.get(path);
          if (existing) throw e;
          await Store.set(path, { workerId: op.workerId, month: op.month, items: { [op.id]: op.patch } });
        } else throw e;
      }
      S.queue.shift(); ls.set('ff_queue', S.queue);
      S.lastSyncOk = Date.now(); S.online = true;
    }
  } catch (e) {
    console.warn('sync failed', e);
    if (e && (e.code === 'invalid_argument' || e.code === 'quota_exceeded')) { // cannot succeed: drop it, tell the user
      const op = S.queue.shift(); ls.set('ff_queue', S.queue);
      toast(t('No se pudo guardar un fichaje ({c}). Avisa a tu responsable.', { c: e.code }), true);
    } else { S.online = false; }
  } finally { flushing = false; rebuildEntries(); render(); }
}
addEventListener('online', () => { S.online = true; flushQueue(); paintSync(); });
addEventListener('offline', () => { S.online = false; paintSync(); });
setInterval(flushQueue, 20000);

/* generic doc writes (workers, centers, settings, notices) */
async function save(path, data, merge = true) {

  catch (e) { console.warn(e); toast(e && e.code === 'invalid_argument' ? t('No tienes permiso para guardar este cambio.') : t('No se pudo guardar. Revisa la conexión y vuelve a intentarlo.'), true); return false; }
}

async function pinHash(id, pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`ff|${id}|${pin}`));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
/* PIN-only login: each person has a unique PIN; the hash is salted with the user's id */

async function userByPin(pin, exceptId = null, includeInactive = false) {
  for (const w of Object.values(S.data.workers)) {
    if (w.id === exceptId || (!includeInactive && w.active === false)) continue;
    if (await pinHash(w.id, pin) === w.pinHash) return w;
  }
  return null;
}
const normPhone = s => String(s || '').replace(/\D/g, '').replace(/^34(?=\d{9}$)/, '');
function findUser(ident) {
  const s = String(ident || '').trim().toLowerCase();
  if (!s) return null;
  return Object.values(S.data.workers).find(w => (w.email || '').toLowerCase() === s || (normPhone(w.phone) && normPhone(w.phone) === normPhone(s))) || null;
}

/* ---------- scope (supervisor zones) ---------- */
function scope() {
  const u = me();
  if (!u || u.role === 'admin') return { all: true, centers: null, workers: null };
  const zones = new Set(u.zones || []);
  const centers = new Set(Object.values(S.data.centers).filter(c => zones.has(c.zone)).map(c => c.id));
  const workers = new Set(Object.values(S.data.workers).filter(w => w.role !== 'admin' && (w.centers || []).some(c => centers.has(c))).map(w => w.id));
  Object.values(S.data.entries).forEach(e => { if (centers.has(e.centerId)) workers.add(e.workerId); });
  return { all: false, centers, workers };
}
const inScopeC = (sc, id) => sc.all || sc.centers.has(id);
const inScopeW = (sc, id) => sc.all || sc.workers.has(id);
const inScopeE = (sc, e) => sc.all || sc.centers.has(e.centerId);

/* ---------- alerts ---------- */
function computeAlerts(now = Date.now()) {
  const st = S.data.settings, out = [], sc = scope();
  const res = S.data.alertState.resolved || {};
  for (const e of Object.values(S.data.entries)) {
    if (e.status !== 'open' || !inScopeE(sc, e)) continue;
    const g = grossMs(e, now);
    if (g > (st.forgetHours || 14) * HOUR) out.push({ key: 'forget_' + e.id, type: 'forget', sev: 'crit', e, title: t('Posible olvido de salida'), detail: t('{w} lleva {d} fichado en {c}', { w: wname(e.workerId), d: dur(g), c: cname(e.centerId) }) });
    else if (g > (st.maxShiftHours || 10) * HOUR) out.push({ key: 'long_' + e.id, type: 'long', sev: 'crit', e, title: t('Turno anormalmente largo'), detail: t('{w} lleva {d} fichado en {c}', { w: wname(e.workerId), d: dur(g), c: cname(e.centerId) }) });
  }
  const today = dkey(now), dow = new Date(now).getDay() || 7;
  const grace = (st.coverageGraceMin ?? 30) * 60000;
  for (const c of Object.values(S.data.centers)) {
    if (!c.active || !inScopeC(sc, c.id) || !c.schedule || !(c.schedule.days || []).includes(dow)) continue;
    const [h, m] = (c.schedule.from || '00:00').split(':').map(Number);
    const due = dayStart(now) + (h * 60 + m) * 60000 + grace;
    if (now < due) continue;
    const covered = Object.values(S.data.entries).some(e => e.centerId === c.id && e.status !== 'void' && (dkey(e.start) === today || (e.status === 'open')));
    if (!covered) out.push({ key: 'cov_' + c.id + '_' + today, type: 'coverage', sev: 'warn', c, title: t('Centro sin cobertura hoy'), detail: t('{c} · horario desde {h} y nadie ha fichado', { c: c.name, h: c.schedule.from }) });
  }
  return out.filter(a => !res[a.key]);
}

function locate(force = false) {
  if (!force && S.geo.pos && Date.now() - S.geo.pos.t < 60000) return Promise.resolve(S.geo.pos);
  return new Promise(res => {
    if (!navigator.geolocation) { S.geo = { state: 'err', pos: null, err: t('Este dispositivo no permite ubicación') }; return res(null); }
    S.geo.state = 'busy';
    let done = false; const fin = v => { if (done) return; done = true; res(v); };
    setTimeout(() => { if (!done) { S.geo = { state: 'err', pos: null, err: t('No se pudo obtener la ubicación a tiempo') }; fin(null); } }, 7000);
    try {
      navigator.geolocation.getCurrentPosition(p => { S.geo = { state: 'ok', pos: { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() }, err: '' }; fin(S.geo.pos); },
        () => { S.geo = { state: 'err', pos: null, err: t('Ubicación no disponible') }; fin(null); }, { enableHighAccuracy: true, timeout: 6500, maximumAge: 60000 });
    } catch { S.geo = { state: 'err', pos: null, err: t('Ubicación no disponible') }; fin(null); }
  });
}

function suggestCenter(list) {
  const now = Date.now();
  if (S.geo.pos) {
    const near = list.map(c => ({ c, d: haversine(S.geo.pos, c) })).sort((a, b) => a.d - b.d)[0];
    if (near && near.d <= Math.max(near.c.radius || 150, 400)) return { c: near.c, why: t('Estás a {d}', { d: fmtDist(near.d) }) };
  }
  const dow = new Date(now).getDay() || 7, mins = new Date(now).getHours() * 60 + new Date(now).getMinutes();
  const sched = list.filter(c => c.schedule && (c.schedule.days || []).includes(dow)).map(c => { const [h, m] = c.schedule.from.split(':').map(Number); let diff = Math.abs(h * 60 + m - mins); diff = Math.min(diff, 1440 - diff); return { c, diff }; }).sort((a, b) => a.diff - b.diff)[0];
  if (sched && sched.diff <= 75) return { c: sched.c, why: t('Tu horario habitual: {h}', { h: sched.c.schedule.from + '–' + sched.c.schedule.to }) };
  const cnt = {}; myEntries().filter(e => e.start > now - 30 * DAY).forEach(e => cnt[e.centerId] = (cnt[e.centerId] || 0) + 1);
  const freq = list.slice().sort((a, b) => (cnt[b.id] || 0) - (cnt[a.id] || 0))[0];
  if (freq && cnt[freq.id]) return { c: freq, why: t('Tu centro más frecuente') };
  return null;
}

async function handleQRFile(file) {
  const msg = $('#qr-msg'); if (!file) return;
  msg.innerHTML = `<div class="small muted">${t('Leyendo código…')}</div>`;
  try {
    await loadScript(LIB.jsqr);
    const url = URL.createObjectURL(file); const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const tries = [1400, 900, 600]; let found = null;
    for (const max of tries) {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
      const r = window.jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
      if (r && r.data) { found = r.data; break; }
    }
    URL.revokeObjectURL(url);
    if (!found) { msg.innerHTML = `<div class="banner warn">${ic('alert')}<div>${t('No se ha encontrado un código QR en la foto. Acércate más y evita reflejos.')}</div></div>`; return; }
    qrClockIn(found);
  } catch (e) { console.warn(e); msg.innerHTML = `<div class="banner warn">${ic('alert')}<div>${t('No se pudo leer la imagen. Escribe el código del cartel.')}</div></div>`; }
}
function qrClockIn(raw) {

  const c = Object.values(S.data.centers).find(x => (x.qr || '').toUpperCase() === code);
  const fail = m => { if (msg) msg.innerHTML = `<div class="banner crit">${ic('alert')}<div>${m}</div></div>`; };
  if (!c) return fail(t('Código no reconocido: {c}', { c: esc(code) }));
  if (c.active === false) return fail(t('Este centro está desactivado.'));
  if (!(me().centers || []).includes(c.id)) return fail(t('{c} no está entre tus centros asignados. Avisa a tu responsable.', { c: esc(c.name) }));
  clockIn(c.id, 'qr', S.geo.pos ? { lat: S.geo.pos.lat, lng: S.geo.pos.lng, acc: S.geo.pos.acc, dist: Math.round(haversine(S.geo.pos, c)) } : null);
}

  return [weekStart(now), now + DAY];
}

function mapSVG(sc, open, covered) {
  const cs = scopedCenters(sc).filter(c => c.active !== false && isFinite(c.lat) && isFinite(c.lng));
  if (!cs.length) return `<div class="empty">${t('Sin centros con coordenadas.')}</div>`;
  const W = 600, H = 380, P = 46;
  const lat0 = cs.reduce((a, c) => a + c.lat, 0) / cs.length, k = Math.cos(lat0 * Math.PI / 180);
  const xs = cs.map(c => c.lng * k), ys = cs.map(c => c.lat);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sx = (W - 2 * P) / Math.max(maxX - minX, 1e-4), sy = (H - 2 * P) / Math.max(maxY - minY, 1e-4), s = Math.min(sx, sy);
  const ox = (W - (maxX - minX) * s) / 2, oy = (H - (maxY - minY) * s) / 2;
  const proj = c => [ox + (c.lng * k - minX) * s, H - (oy + (c.lat - minY) * s)];
  const act = {}; open.forEach(e => act[e.centerId] = (act[e.centerId] || 0) + 1);
  const grid = [1, 2, 3, 4, 5].map(i => `<line x1="0" x2="${W}" y1="${i * H / 6}" y2="${i * H / 6}" stroke="var(--line)" stroke-width="1"/><line y1="0" y2="${H}" x1="${i * W / 6}" x2="${i * W / 6}" stroke="var(--line)" stroke-width="1"/>`).join('');
  const placed = [];
  const hits = (x0, x1, y) => placed.some(b => x0 < b.x1 && x1 > b.x0 && Math.abs(y - b.y) < 14);
  const dots = cs.map(c => ({ c, p: proj(c) })).sort((a, b) => a.p[1] - b.p[1]).map(({ c, p: [x, y0] }) => {
    const n = act[c.id] || 0; const col = n ? 'var(--stop)' : covered.has(c.id) ? 'var(--go)' : 'var(--ink-3)';
    const lw = Math.min(c.name.length, 24) * 6.4;
    let anchor = x > W - 150 ? 'end' : 'start', y = y0;
    const box = (an, yy) => an === 'end' ? [x - 14 - lw, x - 14, yy] : [x + 14, x + 14 + lw, yy];
    const opts = [[anchor, y], [anchor === 'end' ? 'start' : 'end', y], [anchor, y - 15], [anchor, y + 15], [anchor === 'end' ? 'start' : 'end', y + 15]];
    for (const [an, yy] of opts) { const [a0, a1] = box(an, yy); if (a0 >= 0 && a1 <= W && !hits(a0, a1, yy)) { anchor = an; y = yy; break; } }
    const [b0, b1] = box(anchor, y); placed.push({ x0: b0, x1: b1, y });
    const dx = anchor === 'end' ? -14 : 14;
    return `<g><circle cx="${x}" cy="${y0}" r="${n ? 11 : 7}" fill="${col}" opacity="${n ? 1 : .9}"/>${n ? `<text x="${x}" y="${y0 + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="JetBrains Mono,monospace">${n}</text>` : ''}
      <text x="${x + dx}" y="${y + 4}" text-anchor="${anchor}" font-size="12" font-weight="600" fill="var(--ink)" font-family="Archivo,sans-serif">${esc(c.name.length > 24 ? c.name.slice(0, 23) + '…' : c.name)}</text></g>`;
  }).join('');
  return `<div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('Plano de centros')}">${grid}${dots}</svg>
    <div class="row wrap xs muted" style="gap:14px;padding:8px 4px 0"><span class="row" style="gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(--stop)"></span>${t('Con personal ahora')}</span><span class="row" style="gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(--go)"></span>${t('Cubierto hoy')}</span><span class="row" style="gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(--ink-3)"></span>${t('Sin fichajes hoy')}</span></div></div>`;
}

const INPUT = {
  'c-search': v => { S.pick.q = v; paintPick(); },
  'aw-q': v => { S.f.aw.q = v; render(); },
  'ac-q': v => { S.f.ac.q = v; render(); },
};
document.addEventListener('input', ev => { const k = ev.target.dataset && ev.target.dataset.input; if (k && INPUT[k]) INPUT[k](ev.target.value); });
const CHANGE = {
  'lang': v => { S.lang = v; ls.set('ff_lang', v); document.documentElement.lang = v; render(); },
  'remember': (v, el) => { S.login.remember = el.checked; },
  'qr-file': (v, el) => handleQRFile(el.files && el.files[0]),
  'wh-from': v => { S.f.wh.from = v; render(); }, 'wh-to': v => { S.f.wh.to = v; render(); }, 'wh-center': v => { S.f.wh.center = v; render(); },
  'aw-role': v => { S.f.aw.role = v; render(); }, 'aw-active': v => { S.f.aw.active = v; render(); },
  'ac-type': v => { S.f.ac.type = v; render(); }, 'ac-zone': v => { S.f.ac.zone = v; render(); },
  'ah-worker': v => { S.f.ah.worker = v; render(); }, 'ah-center': v => { S.f.ah.center = v; render(); }, 'ah-type': v => { S.f.ah.type = v; render(); },
  'ah-from': v => { S.f.ah.from = v; render(); }, 'ah-to': v => { S.f.ah.to = v; if (v) S.f.ah.cal = v.slice(0, 7); render(); }, 'ah-notes': v => { S.f.ah.notes = v; render(); }, 'ah-status': v => { S.f.ah.status = v; render(); },
  'rep-from': v => { S.f.rep.from = v || S.f.rep.from; render(); }, 'rep-to': v => { S.f.rep.to = v || S.f.rep.to; render(); }, 'rep-worker': v => { S.f.rep.worker = v; render(); }, 'rep-center': v => { S.f.rep.center = v; render(); },
  'sup-zone': async (v, el) => { const w = S.data.workers[el.dataset.w]; const set = new Set(w.zones || []); el.checked ? set.add(el.dataset.z) : set.delete(el.dataset.z); if (await save('workers/' + w.id, { zones: [...set] })) toast(t('Zonas actualizadas')); },
};
document.addEventListener('change', ev => { const k = ev.target.dataset && ev.target.dataset.change; if (k && CHANGE[k]) CHANGE[k](ev.target.value, ev.target); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#overlay').hidden) return closeOverlay();
  if (ev.key === 'Enter' && ev.target.id === 'qr-code') return qrClockIn(ev.target.value);
  const onLogin = !S.session && S.ready.workers;
  if (onLogin && !/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) {
    if (/^\d$/.test(ev.key)) ACT['pin-key']({ dataset: { k: ev.key } });
    else if (ev.key === 'Backspace') ACT['pin-back']();
  }
});

/* ================= Boot ================= */
(async function boot() {
  document.documentElement.lang = S.lang;
  restoreSession(); render();
  await Store.init();
  Store.watchCol('workers', o => { S.data.workers = o; S.ready.workers = true; render(); });
  Store.watchCol('centers', o => { S.data.centers = o; S.ready.centers = true; render(); if (S.overlay === 'pick') paintPick(); });
  Store.watchCol('entries', o => { S.data.monthDocs = o; S.ready.entries = true; rebuildEntries(); render(); });
  Store.watchCol('notices', o => { S.data.notices = o; render(); });
  Store.watchDoc('config/settings', d => { S.data.settings = { ...DEFAULT_SETTINGS, ...(d || {}) }; S.ready.settings = true; render(); });
  Store.watchDoc('config/alerts', d => { S.data.alertState = d || { resolved: {} }; render(); });
  flushQueue();
})();
</script>
